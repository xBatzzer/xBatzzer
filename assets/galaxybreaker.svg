<svg xmlns="http://www.w3.org/2000/svg" width="864" height="260" viewBox="0 0 864 260" role="img" aria-labelledby="title desc">
  <title id="title">GalaxyBreaker — Get it on Google Play</title>
  <desc id="desc">Batzzer's Android game. An animated blue planet with orbiting fragments and a Google Play download badge. Open the game on Google Play.</desc>
  <style>
    .planet { animation: hover 6s ease-in-out infinite; }
    .orbit { transform-origin: 674px 129px; animation: orbit 30s linear infinite; }
    .orbit-back { transform-origin: 674px 129px; animation: orbit 44s linear infinite reverse; }
    .stars { animation: twinkle 4s ease-in-out infinite; }
    .stars-b { animation-delay: -2s; }
    .atmosphere { animation: breathe 5s ease-in-out infinite; }
    .play-badge { animation: hover-badge 5s ease-in-out infinite; }
    .meteor { animation: meteor 6s linear infinite; }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: .9; } }
    @keyframes hover-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes meteor { 0%, 100% { opacity: 0; transform: translate(0); } 12% { opacity: .8; } 50%, 99% { opacity: 0; transform: translate(-92px, 47px); } }
    @media (prefers-reduced-motion: reduce) {
      .planet, .orbit, .orbit-back, .stars, .atmosphere, .play-badge, .meteor { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#10121f"/><stop offset=".6" stop-color="#111c35"/><stop offset="1" stop-color="#1e2245"/></linearGradient>
    <linearGradient id="border" x2="1"><stop stop-color="#98715d"/><stop offset=".48" stop-color="#344d76"/><stop offset="1" stop-color="#6d86ad"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#407aca" stop-opacity=".5"/><stop offset="1" stop-color="#407aca" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop offset=".5" stop-color="#70d9f9" stop-opacity="0"/><stop offset=".76" stop-color="#70d9f9" stop-opacity=".23"/><stop offset="1" stop-color="#70d9f9" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".28" cy=".22" r=".85"><stop stop-color="#93edff"/><stop offset=".32" stop-color="#408fc3"/><stop offset=".7" stop-color="#285584"/><stop offset="1" stop-color="#15253e"/></radialGradient>
    <linearGradient id="ring"><stop stop-color="#f5bb8d" stop-opacity=".2"/><stop offset=".5" stop-color="#ffe0ac"/><stop offset="1" stop-color="#b78bd9" stop-opacity=".5"/></linearGradient>
    <linearGradient id="meteor"><stop stop-color="#9cceff" stop-opacity="0"/><stop offset="1" stop-color="#e8f9ff"/></linearGradient>
    <clipPath id="bounds"><rect x="1" y="1" width="862" height="258" rx="19"/></clipPath>
    <clipPath id="planet-bounds"><circle cx="674" cy="129" r="53"/></clipPath>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#8fa4cf" stroke-opacity=".11"/></pattern>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="864" height="260" fill="url(#surface)"/>
    <ellipse cx="684" cy="128" rx="244" ry="194" fill="url(#nebula)"/>
    <path d="M500 0h364v260H500Z" fill="url(#grid)"/>
    <path d="M489 33v194" stroke="#8ca4c9" stroke-opacity=".18"/>
    <g class="stars" fill="#d4e8ff">
      <circle cx="540" cy="45" r="1.7"/><circle cx="774" cy="43" r="1.4"/><circle cx="812" cy="160" r="1.6"/><circle cx="551" cy="178" r="1.5"/>
      <path d="M808 68h10m-5-5v10M569 111h8m-4-4v8" fill="none" stroke="#c9edff"/>
    </g>
    <g class="stars stars-b" fill="#f7cbab">
      <circle cx="612" cy="23" r="1.3"/><circle cx="827" cy="219" r="1.3"/><circle cx="759" cy="205" r="1.6"/><circle cx="545" cy="228" r="1.6"/>
      <path d="m777 103 3-3 3 3-3 3Z"/>
    </g>
    <path class="meteor" d="m746 34 64-32" stroke="url(#meteor)" stroke-width="2" stroke-linecap="round"/>
    <circle class="atmosphere" cx="674" cy="129" r="100" fill="url(#halo)"/>
    <circle cx="674" cy="129" r="103" fill="none" stroke="#7ba6e0" stroke-opacity=".27" stroke-dasharray="1 7" stroke-width="2"/>
    <g class="orbit-back" fill="none" stroke="#8fb4df" stroke-opacity=".42">
      <path d="M587 79a100 100 0 0 1 87-50m87 150a100 100 0 0 1-87 50"/>
      <path d="m582 89 7-6 8 8-6 7Z" fill="#314e74" stroke="#9ed3f3"/>
      <path d="m751 183 10 2-3 10-10-4Z" fill="#614b69" stroke="#ddbadf"/>
    </g>
    <g class="planet">
      <ellipse cx="674" cy="129" rx="91" ry="24" transform="rotate(-27 674 129)" fill="none" stroke="url(#ring)" stroke-width="4"/>
      <circle cx="674" cy="129" r="53" fill="url(#planet)" stroke="#8ccff2" stroke-opacity=".6"/>
      <g clip-path="url(#planet-bounds)" fill="none" stroke-linecap="round">
        <path d="M626 109q28-22 59-5t38-4m-103 37q29-16 58-3t47-8m-96 31q34-10 57 0t36-4" stroke="#99d9e8" stroke-opacity=".23" stroke-width="8"/>
        <path d="M639 87q19-9 36-5m-46 33q22-10 42 0m-23 31q32-4 53 8" stroke="#c9f6ff" stroke-opacity=".35" stroke-width="2"/>
        <ellipse cx="706" cy="150" rx="38" ry="63" fill="#091a33" opacity=".24"/>
      </g>
      <path d="M594 159q43 24 122-13t33-46" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>
      <path d="M602 164q43 17 105-10" fill="none" stroke="#fff0d4" stroke-opacity=".7" stroke-width="1.3"/>
    </g>
    <g class="orbit">
      <path d="m674 23 5 9-5 9-5-9Z" fill="#ffcf9b"/>
      <circle cx="674" cy="226" r="3" fill="#a2dffb"/>
      <path d="m763 77 8 3-2 7-9-3Z" fill="#77648e" stroke="#cdb0e8"/>
    </g>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <text x="40" y="102" fill="#fff3e9" font-size="54" font-weight="800" letter-spacing="-1.8">GalaxyBreaker</text>
      <text x="42" y="139" fill="#cfdaec" font-size="24">My Android game</text>
    </g>
    <text x="42" y="43" fill="#ffcb9d" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.4">ANDROID GAME</text>
    <g class="play-badge">
      <image x="22" y="149" width="300" height="116.1" href="data:image/png;base64,"/>
    </g>
    <path d="M348 211h31m-8-8 8 8-8 8" fill="none" stroke="#ffcf9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="819" y="235" text-anchor="end" fill="#b3c6e5" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.7">BY BATZZER</text>
    <path d="M22 27v-5h19m801 5v-5h-19M22 233v5h19" fill="none" stroke="#c2a68d" stroke-opacity=".6"/>
  </g>
  <rect x="1" y="1" width="862" height="258" rx="19" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
