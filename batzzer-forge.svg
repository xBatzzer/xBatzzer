<svg xmlns="http://www.w3.org/2000/svg" width="864" height="320" viewBox="0 0 864 320" role="img" aria-labelledby="title desc">
  <title id="title">Batzzer — Gaming &amp; Technology</title>
  <desc id="desc">A glowing sword and anvil surrounded by circuit traces, orbiting runes, and rising sparks. Game development and full-stack engineering.</desc>
  <style>
    .orbit { transform-origin: 653px 150px; animation: orbit 4.8s cubic-bezier(.16,.65,.3,1) both; }
    .sword { animation: settle 3.6s cubic-bezier(.2,.65,.3,1) both; }
    .ember { animation: rise 3s ease-out both; }
    .ember-b { animation-delay: .55s; }
    .ember-c { animation-delay: 1.1s; }
    .signal { animation: signal 3s ease-in-out both; }
    @keyframes orbit { from { transform: rotate(-96deg); } to { transform: rotate(0); } }
    @keyframes settle { from { transform: translate(7px, -10px); } to { transform: translate(0); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(24px); } 24% { opacity: 1; } 100% { opacity: .65; transform: translateY(0); } }
    @keyframes signal { 0%, 100% { opacity: .65; } 55% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .sword, .ember, .signal { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#100e1b"/><stop offset=".52" stop-color="#181329"/><stop offset="1" stop-color="#23152c"/>
    </linearGradient>
    <radialGradient id="violet-haze">
      <stop stop-color="#8253dc" stop-opacity=".43"/><stop offset="1" stop-color="#8253dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat">
      <stop stop-color="#ff9857" stop-opacity=".59"/><stop offset="1" stop-color="#ff9857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x2="1" y2="1">
      <stop stop-color="#605078"/><stop offset=".57" stop-color="#45345f"/><stop offset="1" stop-color="#aa674f"/>
    </linearGradient>
    <linearGradient id="blade" x2="1" y2="1">
      <stop stop-color="#fff1d6"/><stop offset=".38" stop-color="#ffd199"/><stop offset="1" stop-color="#e68155"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#493963"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="pedestal">
      <stop stop-color="#2a1f40"/><stop offset=".53" stop-color="#524063"/><stop offset="1" stop-color="#231930"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#a386cf" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="862" height="318" rx="19"/></clipPath>
    <path id="diamond" d="M0-5 5 0 0 5-5 0Z"/>
  </defs>

  <g clip-path="url(#bounds)">
    <rect width="864" height="320" fill="url(#background)"/>
    <ellipse cx="651" cy="136" rx="278" ry="194" fill="url(#violet-haze)"/>
    <path d="M448 17H847V267H448Z" fill="url(#grid)"/>
    <path d="M465 80h48l22 22h45m-88 72h-30m0 0v34h55l30-30m185-58h35l25-25h35m-93 74h38l22 22h34m-65 22h27l21 21h15" fill="none" stroke="#ae8ce7" stroke-opacity=".29"/>
    <g fill="#151122" stroke="#aa8ace" stroke-opacity=".55">
      <circle cx="465" cy="80" r="3"/><circle cx="462" cy="174" r="3"/><circle cx="827" cy="95" r="3"/><circle cx="828" cy="191" r="3"/><circle cx="829" cy="234" r="3"/>
    </g>
    <path d="M453 240h383m-357 8h336m-315 10h296m-272 9h253m-200-26-49 26m99-26-21 26m68-26 10 26m37-26 38 26" fill="none" stroke="#9d7ec3" stroke-opacity=".19"/>
    <ellipse cx="653" cy="241" rx="135" ry="45" fill="url(#heat)" opacity=".35"/>

    <g fill="none" stroke="#b991ec">
      <circle cx="653" cy="150" r="110" stroke-opacity=".31" stroke-dasharray="1 7" stroke-width="2"/>
      <circle cx="653" cy="150" r="95" stroke-opacity=".37"/>
      <circle cx="653" cy="150" r="80" stroke-opacity=".18" stroke-dasharray="5 8"/>
      <path d="M543 150h13m194 0h13M653 40v14m0 192v14" stroke-opacity=".7"/>
      <path d="M555 123a102 102 0 0 1 40-57m116 168a102 102 0 0 0 40-57" stroke-width="2" stroke-opacity=".57"/>
      <g class="orbit">
        <path d="M586 83a95 95 0 0 1 134 0m0 134a95 95 0 0 1-134 0" stroke="#d0a8ff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="43 6 2 6"/>
        <use href="#diamond" x="586" y="83" fill="#d9b2ff" stroke="none"/>
        <use href="#diamond" x="720" y="217" fill="#ffd09e" stroke="none"/>
      </g>
    </g>

    <ellipse class="signal" cx="652" cy="206" rx="84" ry="42" fill="url(#heat)"/>
    <path d="M568 202h155l-17 14h-28l-16 13v11h24v8h-81v-8h24v-11l-19-13h-25Z" fill="url(#steel)" stroke="#a78bbc" stroke-linejoin="round"/>
    <path d="m568 202 20-7h112l23 7Z" fill="url(#pedestal)" stroke="#c5a2d7" stroke-linejoin="round"/>
    <path d="M610 204h85l-18 3h-50Z" fill="#ffb77a" opacity=".83"/>
    <path d="M605 248h81m-68-31 22 12v11m21-13h-16" fill="none" stroke="#816896"/>

    <g class="sword">
      <g transform="translate(659 138) rotate(34)">
        <path d="M0-77 11-57 10 26 5 41h-10l-5-15-1-83Z" fill="url(#blade)" stroke="#ffe1b1" stroke-linejoin="round"/>
        <path d="M0-70 4-51 4 32 0 38-4 32-4-51Z" fill="#fff4dd"/>
        <path d="M0-54v79m-7-66 7-7 7 7m-7 22 5 5-5 5-5-5Z" fill="none" stroke="#a54c55" stroke-opacity=".83" stroke-linecap="round"/>
        <path d="M-24 35-15 39l15-3 15 3 9-4-3 10-21 4-21-4Z" fill="#be785f" stroke="#ffcf9a" stroke-linejoin="round"/>
        <path d="M-5 48H5L4 71h-8Z" fill="#4d305b" stroke="#e9aa85"/>
        <path d="m-4 53 8 4m-8 2 8 4m-8 2 8 4" stroke="#d6a1b9"/>
        <path d="M0 69 8 76 0 84-8 76Z" fill="#ae785f" stroke="#ffd29b"/>
        <path d="M0 72 4 76 0 80-4 76Z" fill="#dfb4ff"/>
      </g>
    </g>

    <g fill="#ffd19b" opacity=".65">
      <g class="ember"><use href="#diamond" x="593" y="162"/><rect x="605" y="183" width="3" height="3"/><rect x="719" y="121" width="3" height="3"/></g>
      <g class="ember ember-b"><rect x="577" y="185" width="4" height="4"/><use href="#diamond" x="719" y="169"/><rect x="739" y="157" width="3" height="3"/></g>
      <g class="ember ember-c"><rect x="606" y="129" width="4" height="4"/><rect x="688" y="177" width="4" height="4"/><rect x="722" y="194" width="4" height="4"/></g>
    </g>

    <path d="M28 28h28m-28 0v16m808-16h-28m28 0v16M28 292h28m-28 0v-16m808 16h-28m28 0v-16" fill="none" stroke="#a886b4" stroke-opacity=".58"/>
    <path d="M44 248h351" stroke="#5b476a"/>
    <path d="M44 248h72" stroke="#d88c69" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace">
      <use href="#diamond" x="49" y="72" fill="#ffc591"/>
      <text x="65" y="78" fill="#ffc591" font-size="18" font-weight="700" letter-spacing="2.2">GAMING &amp; TECHNOLOGY</text>
      <text x="44" y="279" fill="#cdb9e2" font-size="17" font-weight="700" letter-spacing="1.25">UNITY  /  C#  /  .NET</text>
      <text x="820" y="279" text-anchor="end" fill="#d1b9e7" font-size="14" letter-spacing="1.2">@xBatzzer</text>
    </g>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <text x="40" y="167" fill="#fff3e5" font-size="82" font-weight="850" letter-spacing="-2">BATZZER</text>
      <text x="44" y="209" fill="#e4d8ef" font-size="24" font-weight="550">Game dev &amp; full-stack engineering</text>
    </g>
  </g>
  <rect x="1" y="1" width="862" height="318" rx="19" fill="none" stroke="url(#frame)" stroke-width="2"/>
</svg>
